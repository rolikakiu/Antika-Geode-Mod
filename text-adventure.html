<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dark Dungeon</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --text: #d4d4d4;
    --text-muted: #666;
    --accent: #4fc3f7;
    --accent-dim: #2196f3;
    --hp-high: #4caf50;
    --hp-mid: #ff9800;
    --hp-low: #f44336;
    --gold: #ffd700;
    --radius: 12px;
  }

  body {
    font-family: 'Courier New', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .stats {
    display: flex;
    gap: 20px;
    font-size: 13px;
    align-items: center;
  }

  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-label { color: var(--text-muted); }

  .hp-bar {
    width: 120px; height: 10px;
    background: #1a1a2e;
    border-radius: 5px;
    overflow: hidden;
  }
  .hp-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.4s, background 0.4s;
  }

  #game-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #story {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    scroll-behavior: smooth;
  }

  #story::-webkit-scrollbar { width: 6px; }
  #story::-webkit-scrollbar-track { background: transparent; }
  #story::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }

  .entry {
    margin-bottom: 20px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    line-height: 1.7;
    font-size: 14px;
    animation: fadeIn 0.3s ease;
  }

  .entry.narrator { border-left: 3px solid var(--accent); }
  .entry.combat { border-left: 3px solid #f44336; }
  .entry.loot { border-left: 3px solid var(--gold); }
  .entry.player-action { border-left: 3px solid #a78bfa; color: #bbb; }
  .entry.death { border-left: 3px solid #f44336; background: #1a0a0a; }

  .entry strong { color: var(--accent); }

  .entry .room-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #choices {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex-shrink: 0;
  }

  .choice-btn {
    flex: 1 1 auto;
    min-width: 140px;
    padding: 12px 20px;
    background: rgba(20, 20, 35, 0.9);
    border: 1px solid #303051;
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .choice-btn:hover {
    border-color: var(--accent);
    background: rgba(79, 195, 247, 0.1);
    transform: translateY(-1px);
  }

  .choice-btn:active { transform: translateY(0); }

  .choice-btn.attack { border-color: #553333; }
  .choice-btn.attack:hover { border-color: #f44336; background: rgba(244, 67, 54, 0.1); }
  .choice-btn.heal { border-color: #334433; }
  .choice-btn.heal:hover { border-color: #4caf50; background: rgba(76, 175, 80, 0.1); }
  .choice-btn.special { border-color: #443355; }
  .choice-btn.special:hover { border-color: #a78bfa; background: rgba(167, 139, 250, 0.1); }

  #title-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 100;
    gap: 16px;
    transition: opacity 0.5s;
  }

  #title-screen h1 {
    font-size: 48px; font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent), #a78bfa, #f48fb1);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  #title-screen p {
    color: var(--text-muted);
    font-size: 14px;
    letter-spacing: 2px;
  }

  #title-screen .btn {
    margin-top: 24px;
    padding: 14px 48px;
    background: rgba(20, 20, 35, 0.9);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    color: var(--accent);
    font-family: 'Courier New', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  #title-screen .btn:hover {
    background: rgba(79, 195, 247, 0.15);
    transform: scale(1.05);
  }

  .hidden { display: none !important; }

  #game-over {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(10,10,15,0.95);
    z-index: 100;
    gap: 12px;
  }

  #game-over h1 { font-size: 40px; color: #f44336; letter-spacing: 3px; }
  #game-over .victory { color: var(--gold); }
  #game-over p { color: var(--text-muted); font-size: 14px; }

  .head-btn {
    padding: 8px 16px;
    background: rgba(20, 20, 35, 0.9);
    border: 1px solid #303051;
    border-radius: 8px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .head-btn:hover { border-color: var(--accent); color: var(--accent); }
  .head-btn:disabled { opacity: 0.4; cursor: default; }
  .head-btns { display: flex; gap: 10px; align-items: center; }

  #cloud-badge {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
    white-space: nowrap;
  }

  #title-screen .btn-row { display: flex; gap: 16px; margin-top: 24px; }
  #title-screen .btn.secondary {
    border-color: #505070;
    color: var(--text-muted);
    background: rgba(20,20,35,0.6);
  }
  #title-screen .btn.secondary:hover { border-color: var(--accent); color: var(--accent); }

  #save-modal {
    position: fixed; inset: 0;
    background: rgba(10, 10, 15, 0.8);
    z-index: 90;
    display: flex;
    align-items: center; justify-content: center;
  }

  .modal {
    width: min(520px, 92vw);
    max-height: 84vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .modal h2 {
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .slot-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: rgba(20, 20, 35, 0.9);
    border: 1px solid #303051;
    border-radius: 10px;
  }

  .slot-info { flex: 1; min-width: 0; }
  .slot-name { font-weight: 700; font-size: 13px; letter-spacing: 1px; color: var(--text); }
  .slot-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }

  .slot-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .min-btn {
    padding: 6px 12px;
    background: transparent;
    border: 1px solid #404060;
    border-radius: 7px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .min-btn:hover { border-color: var(--accent); color: var(--accent); }
  .min-btn.danger:hover { border-color: #f44336; color: #f44336; }
  .min-btn.gold:hover { border-color: var(--gold); color: var(--gold); }

  .modal-note {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 14px;
    letter-spacing: 1px;
    line-height: 1.6;
  }

  #mp-strip {
    padding: 7px 24px;
    background: #0e1018;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  #mp-strip b { color: var(--accent); }

  .mp-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    margin-bottom: 8px;
    background: rgba(20, 20, 35, 0.9);
    border: 1px solid #303051;
    border-radius: 9px;
    font-size: 12.5px;
    letter-spacing: 1px;
  }
  .mp-row .rank { color: var(--accent); font-weight: 700; }
  .mp-row .who { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-row .meta { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
  .mp-empty { color: var(--text-muted); font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>

<div id="title-screen">
  <h1>THE DARK DUNGEON</h1>
  <p>A text adventure</p>
  <div class="btn-row">
    <button class="btn" onclick="startGame()">ENTER</button>
    <button class="btn secondary" id="continue-btn" onclick="openSaveModal(true)">CONTINUE</button>
  </div>
</div>

<div id="game-over" class="hidden">
  <h1 id="go-title">YOU DIED</h1>
  <p id="go-msg">The darkness consumed you.</p>
  <p id="go-stats"></p>
  <button class="btn" style="margin-top:20px; border-color:var(--accent); color:var(--accent);" onclick="location.reload()">TRY AGAIN</button>
</div>

<header>
  <h1>DUNGEON</h1>
  <div class="stats">
    <div class="stat">
      <span class="stat-label">HP</span>
      <div class="hp-bar"><div class="hp-fill" id="hp-fill" style="width:100%;background:var(--hp-high)"></div></div>
      <span id="hp-text">20/20</span>
    </div>
    <div class="stat">
      <span class="stat-label">ATK</span>
      <span id="atk-text">3</span>
    </div>
    <div class="stat">
      <span class="stat-label">GOLD</span>
      <span id="gold-text" style="color:var(--gold)">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">TIME</span>
      <span id="time-text">0:00</span>
    </div>
    <div class="stat">
      <span class="stat-label">ROOM</span>
      <span id="room-text">1</span>
    </div>
    <div class="head-btns">
      <span id="cloud-badge"></span>
      <button class="head-btn" onclick="openMP()">👥 MP</button>
      <button class="head-btn" onclick="openSaveModal(false)">💾 SAVE</button>
      <button class="head-btn" onclick="openSaveModal(true)">📂 LOAD</button>
    </div>
  </div>
</header>

<div id="mp-strip" class="hidden"></div>

<div id="mp-modal" class="hidden">
  <div class="modal">
    <h2>MULTIPLAYER</h2>
    <div class="modal-note" id="mp-online"></div>
    <h3 style="margin:16px 0 10px; font-size:13px; letter-spacing:2px; color:var(--text-muted);">FASTEST ESCAPES</h3>
    <div id="mp-board"></div>
    <button class="head-btn" style="margin-top:16px;" onclick="closeMP()">CLOSE</button>
  </div>
</div>

<div id="save-modal" class="hidden">
  <div class="modal">
    <h2 id="sm-title">SAVE / LOAD</h2>
    <div id="slot-list"></div>
    <div class="modal-note" id="sm-note"></div>
  </div>
</div>

<div id="game-area">
  <div id="story"></div>
  <div id="choices"></div>
</div>

<script>
const S = {
  hp: 20, maxHp: 20, atk: 3, gold: 0, room: 0, potions: 2,
  inventory: [], flags: {}, enemiesDefeated: 0,
  elapsed: 0, moves: 0, milestones: [], startAt: null, finished: false
};

/* ---------------- Save / load system ---------------- */
const API_URL = (location.protocol === 'file:') ? 'http://localhost:3000' : '';
const SLOTS = ['Slot 1', 'Slot 2', 'Slot 3', 'Slot 4'];
const LS_KEY = 'ta_saves';

function getToken() {
  try {
    const s = JSON.parse(localStorage.getItem('gd_session') || 'null');
    return (s && s.token) ? s.token : null;
  } catch (e) { return null; }
}
function cloudUser() {
  try {
    const s = JSON.parse(localStorage.getItem('gd_session') || 'null');
    return (s && s.name) ? s.name : null;
  } catch (e) { return null; }
}

async function api(path, method, body, token) {
  const opts = { method: method || 'GET', headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  try {
    const res = await fetch(API_URL + path, opts);
    let data = null;
    try { data = await res.json(); } catch (e) {}
    return { ok: res.ok, status: res.status, data: data || {} };
  } catch (e) {
    return { ok: false, status: 0, data: { error: 'Cannot reach server' } };
  }
}

/* ---------------- Multiplayer (leaderboard + ghosts) ---------------- */
const MP_WS_URL = (location.protocol === 'file:') ? 'ws://localhost:3000/ws' : (location.protocol === 'https:' ? 'wss://' + location.host + '/ws' : 'ws://' + location.host + '/ws');
let mpWs = null, mpRetry = 0, mpOnline = 0, mpClock = null;
let taBoard = [];
let topGhost = null;

function fmtDur(ms) {
  const s = Math.max(0, Math.floor((ms || 0) / 1000));
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}
function escT(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function startClock() {
  stopClock();
  if (S.startAt == null) S.startAt = Date.now() - (S.elapsed || 0);
  mpClock = setInterval(() => {
    S.elapsed = Date.now() - S.startAt;
    updateTimer();
    updateGhostStrip();
  }, 1000);
  updateTimer();
  updateGhostStrip();
}
function stopClock() { if (mpClock) { clearInterval(mpClock); mpClock = null; } }
function updateTimer() {
  const el = $('time-text');
  if (el) el.textContent = fmtDur(S.elapsed);
}

function mpConnect() {
  if (mpWs && (mpWs.readyState === 0 || mpWs.readyState === 1)) return;
  try { mpWs = new WebSocket(MP_WS_URL); } catch (e) { return; }
  mpWs.onopen = () => {
    mpRetry = 0;
    sendWs({ type: 'join', game: 'text-adventure', level: 'dungeon', name: cloudUser() || 'Anonymous' });
    updateMpOnline();
  };
  mpWs.onmessage = (ev) => { try {
    const m = JSON.parse(ev.data);
    if (m.type === 'room') { mpOnline = m.count || 0; updateMpOnline(); }
  } catch (e) {} };
  mpWs.onclose = () => { mpWs = null; mpOnline = 0; updateMpOnline(); if (mpRetry < 3) { mpRetry++; setTimeout(mpConnect, 1500 * mpRetry); } };
  mpWs.onerror = () => { try { mpWs.close(); } catch (e) {} };
}
function sendWs(o) { if (mpWs && mpWs.readyState === 1) { try { mpWs.send(JSON.stringify(o)); } catch (e) {} } }
function updateMpOnline() {
  const el = $('mp-online');
  if (el) el.textContent = mpOnline > 0 ? '✦ ' + mpOnline + ' adventurer(s) online right now' : 'You are alone in these halls…';
}
function openMP() { $('mp-modal').classList.remove('hidden'); renderBoard(); updateMpOnline(); }
function closeMP() { $('mp-modal').classList.add('hidden'); }

async function uploadTARun(complete) {
  const samples = (S.milestones || []).slice();
  if (S.startAt != null) samples.push({ room: S.room, t: Date.now() - S.startAt, end: true });
  if (samples.length < 2) return;
  api('/api/replays', 'POST', {
    game: 'text-adventure', level: 'dungeon',
    durationMs: Math.round(S.elapsed || 0),
    score: S.room, complete: complete ? 1 : 0,
    samples
  }, getToken()).catch(() => {});
}
async function loadBoard() {
  const r = await api('/api/replays?game=text-adventure&level=dungeon&limit=5', 'GET');
  taBoard = (r.ok && r.data.replays) ? r.data.replays : [];
  topGhost = null;
  for (const g of taBoard) {
    if (g.complete && Array.isArray(g.samples) && g.samples.length) { topGhost = g; break; }
  }
  if (!$('mp-modal').classList.contains('hidden')) renderBoard();
  updateGhostStrip();
}
function renderBoard() {
  const el = $('mp-board');
  if (!el) return;
  if (!taBoard.length) { el.innerHTML = '<div class="mp-empty">No runs yet — be the first to escape the dungeon!</div>'; return; }
  el.innerHTML = taBoard.map((g, i) =>
    '<div class="mp-row"><span class="rank">#' + (i + 1) + '</span><span class="who">' + escT(g.username) + '</span><span class="meta">' +
    (g.complete ? '🏆 ' : '') + fmtDur(g.durationMs) + ' · Room ' + g.score + '</span></div>'
  ).join('');
}
function updateGhostStrip() {
  const el = $('mp-strip');
  if (!el) return;
  if (S.finished || !topGhost) { el.classList.add('hidden'); return; }
  const gs = topGhost.samples || [];
  let ghostRoom = 0;
  for (const ms of gs) {
    if (!ms || ms.end === true) continue;
    if ((ms.t || 0) <= (S.elapsed || 0) && ms.room > ghostRoom) ghostRoom = ms.room;
  }
  el.classList.remove('hidden');
  const ahead = ghostRoom > S.room;
  el.innerHTML = '👻 Ghost of <b>' + escT(topGhost.username) + '</b> (won in ' + fmtDur(topGhost.durationMs) + ') is in Room <b>' + ghostRoom + '</b> · you are in Room <b>' + S.room + '</b> — ' + (ahead ? 'catch up!' : 'you lead!');
}

function snapshot() {
  return {
    hp: S.hp, maxHp: S.maxHp, atk: S.atk, gold: S.gold,
    room: S.room, potions: S.potions,
    inventory: S.inventory.slice(), flags: Object.assign({}, S.flags),
    enemiesDefeated: S.enemiesDefeated,
    elapsed: S.elapsed || 0, moves: S.moves || 0, milestones: S.milestones ? S.milestones.slice() : []
  };
}

async function cloudSaves() {
  const r = await api('/api/saves?game=text-adventure', 'GET', null, getToken());
  if (!r.ok) return { ok: false, saves: [] };
  return { ok: true, saves: r.data.saves || [] };
}
function localSaves() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
  catch (e) { return {}; }
}
function setLocalSaves(obj) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(obj)); } catch (e) {}
}

function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

async function saveGame(slot) {
  if (S.room < 1) { addToast('Start a game before saving'); return; }
  const token = getToken();
  const state = snapshot();
  if (token) {
    const r = await api('/api/saves', 'POST', { game: 'text-adventure', slot, state }, token);
    if (!r.ok) { addToast(r.data.error || 'Save failed'); return; }
  } else {
    const all = localSaves();
    all[slot] = { slot, state, updatedAt: Date.now() };
    setLocalSaves(all);
  }
  addToast('💾 Saved to ' + slot);
  refreshBadge();
}

async function loadGame(slot) {
  const token = getToken();
  let entry = null;
  if (token) {
    const { saves } = await cloudSaves();
    entry = saves.find(s => s.slot === slot) || null;
  } else {
    const all = localSaves();
    entry = all[slot] || null;
  }
  if (!entry || !entry.state) { addToast('Slot is empty'); return; }
  closeSaveModal();
  resumeGame(entry.state);
}

async function deleteSave(slot) {
  const token = getToken();
  if (token) {
    const { saves } = await cloudSaves();
    const entry = saves.find(s => s.slot === slot);
    if (entry) await api('/api/saves/' + entry.id, 'DELETE', null, token);
  } else {
    const all = localSaves();
    if (all[slot]) { delete all[slot]; setLocalSaves(all); }
  }
  renderSaves();
  refreshBadge();
}

async function renderSaves() {
  const list = $('slot-list');
  list.innerHTML = '';
  const token = getToken();
  let bySlot = {};
  if (token) {
    const { saves } = await cloudSaves();
    saves.forEach(s => { bySlot[s.slot] = s; });
  } else {
    bySlot = localSaves();
  }

  SLOTS.forEach(slot => {
    const entry = bySlot[slot];
    const row = document.createElement('div');
    row.className = 'slot-row';
    const has = !!(entry && entry.state);
    const st = has ? entry.state : null;

    const info = document.createElement('div');
    info.className = 'slot-info';
    info.innerHTML = '<div class="slot-name">' + slot + '</div>' +
      '<div class="slot-meta">' + (has
        ? 'Room ' + (st.room || 0) + ' · HP ' + st.hp + '/' + st.maxHp + ' · 🪙 ' + st.gold + ' · saved ' + fmtTime(entry.updatedAt)
        : 'Empty slot') + '</div>';
    row.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'slot-actions';

    const saveBtn = document.createElement('button');
    saveBtn.className = 'min-btn gold';
    saveBtn.textContent = '💾 Save';
    saveBtn.onclick = () => saveGame(slot);
    actions.appendChild(saveBtn);

    const loadBtn = document.createElement('button');
    loadBtn.className = 'min-btn';
    loadBtn.textContent = '▶ Load';
    loadBtn.disabled = !has;
    loadBtn.style.opacity = has ? '1' : '0.4';
    loadBtn.onclick = () => loadGame(slot);
    actions.appendChild(loadBtn);

    if (has) {
      const delBtn = document.createElement('button');
      delBtn.className = 'min-btn danger';
      delBtn.textContent = '✕';
      delBtn.onclick = () => deleteSave(slot);
      actions.appendChild(delBtn);
    }

    row.appendChild(actions);
    list.appendChild(row);
  });

  const note = $('sm-note');
  const user = cloudUser();
  note.textContent = user
    ? 'Cloud saves — linked to account "' + user + '". Saves follow you across devices.'
    : 'Local saves — stored in this browser only. Log in to sync saves to your account.';
}

function openSaveModal(loadFocus) {
  $('save-modal').classList.remove('hidden');
  renderSaves();
}

function closeSaveModal() {
  $('save-modal').classList.add('hidden');
}

function resumeGame(snap) {
  S.hp = snap.hp; S.maxHp = snap.maxHp; S.atk = snap.atk; S.gold = snap.gold;
  S.room = snap.room; S.potions = snap.potions;
  S.inventory = snap.inventory || []; S.flags = snap.flags || {};
  S.enemiesDefeated = snap.enemiesDefeated || 0;
  S.elapsed = snap.elapsed || 0; S.moves = snap.moves || 0; S.milestones = (snap.milestones || []).slice();
  S.startAt = null; S.finished = false;
  updateStats();
  $('story').innerHTML = '';
  $('title-screen').classList.add('hidden');
  addEntry('<div class="room-title">Resuming</div>The dungeon remembers you. You are in <strong>Room ' + S.room + '</strong>.', 'player-action');
  startClock();
  const rooms = [room1, room2, room3, room4, room5, room6, room7, room8, room9, roomBoss];
  if (S.room >= 1 && S.room <= rooms.length) {
    rooms[S.room - 1]();
  } else {
    victory();
  }
}

function addToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);color:var(--text);border-radius:8px;padding:10px 20px;font-size:13px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:fadeIn 0.3s;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; setTimeout(() => t.remove(), 400); }, 2200);
}

function refreshBadge() {
  const user = cloudUser();
  $('cloud-badge').textContent = user ? '☁ ' + user : '📁 this browser';
  $('continue-btn').disabled = false;
}

$('save-modal').addEventListener('click', (e) => {
  if (e.target === $('save-modal')) closeSaveModal();
});
$('mp-modal').addEventListener('click', (e) => {
  if (e.target === $('mp-modal')) closeMP();
});

function $(id) { return document.getElementById(id); }

function updateStats() {
  $('hp-text').textContent = S.hp + '/' + S.maxHp;
  $('atk-text').textContent = S.atk;
  $('gold-text').textContent = S.gold;
  $('room-text').textContent = S.room;
  const pct = Math.max(0, S.hp / S.maxHp * 100);
  const fill = $('hp-fill');
  fill.style.width = pct + '%';
  fill.style.background = pct > 50 ? 'var(--hp-high)' : pct > 25 ? 'var(--hp-mid)' : 'var(--hp-low)';
}

function addEntry(text, type = 'narrator') {
  const d = document.createElement('div');
  d.className = 'entry ' + type;
  d.innerHTML = text;
  $('story').appendChild(d);
  $('story').scrollTop = $('story').scrollHeight;
}

function clearChoices() { $('choices').innerHTML = ''; }

function showChoices(choices) {
  clearChoices();
  choices.forEach(c => {
    const b = document.createElement('button');
    b.className = 'choice-btn' + (c.cls ? ' ' + c.cls : '');
    b.textContent = c.label;
    b.onclick = () => { clearChoices(); S.moves++; c.action(); };
    $('choices').appendChild(b);
  });
}

function checkDeath() {
  if (S.hp <= 0) {
    S.hp = 0;
    S.finished = true; S.endAt = Date.now();
    stopClock();
    updateStats();
    $('go-title').textContent = 'YOU DIED';
    $('go-title').className = '';
    $('go-msg').textContent = 'The darkness consumed you.';
    $('go-stats').textContent = 'Rooms explored: ' + S.room + ' | Gold found: ' + S.gold + ' | Time: ' + fmtDur(S.elapsed) + ' | Enemies slain: ' + S.enemiesDefeated;
    $('game-over').classList.remove('hidden');
    uploadTARun(false);
    loadBoard();
    return true;
  }
  return false;
}

function victory() {
  S.finished = true; S.endAt = Date.now();
  stopClock();
  updateStats();
  $('go-title').textContent = 'VICTORY!';
  $('go-title').className = 'victory';
  $('go-msg').textContent = 'You escaped the dungeon with ' + S.gold + ' gold and ' + S.hp + ' HP remaining.';
  $('go-stats').textContent = 'Rooms cleared: ' + S.room + ' | Moves: ' + S.moves + ' | Time: ' + fmtDur(S.elapsed) + ' | Enemies slain: ' + S.enemiesDefeated;
  $('game-over').classList.remove('hidden');
  uploadTARun(true);
  loadBoard();
}

function heal(amount) {
  const prev = S.hp;
  S.hp = Math.min(S.maxHp, S.hp + amount);
  updateStats();
  if (S.hp > prev) addEntry('You recovered <strong>' + (S.hp - prev) + ' HP</strong>. (HP: ' + S.hp + '/' + S.maxHp + ')', 'loot');
}

function takeDamage(dmg) {
  S.hp -= dmg;
  updateStats();
  return S.hp <= 0;
}

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function combatEnemy(name, hp, atk, gold, onWin) {
  addEntry('<strong>' + name + '</strong> appears! (HP: ' + hp + ' | ATK: ' + atk + ')', 'combat');

  function fightMenu() {
    const choices = [
      { label: '⚔ Attack (' + S.atk + ' dmg)', cls: 'attack', action: () => {
        const dmg = rand(Math.max(1, S.atk - 1), S.atk + 1);
        hp -= dmg;
        addEntry('You strike the ' + name + ' for <strong>' + dmg + ' damage</strong>! (' + name + ' HP: ' + Math.max(0, hp) + ')', 'combat');
        if (hp <= 0) {
          S.gold += gold;
          S.enemiesDefeated++;
          updateStats();
          addEntry('The ' + name + ' falls! You loot <strong style="color:var(--gold)">' + gold + ' gold</strong>.', 'loot');
          if (onWin) onWin();
          return;
        }
        enemyTurn();
      }},
    ];
    if (S.potions > 0) {
      choices.push({ label: '🧪 Potion (' + S.potions + ' left)', cls: 'heal', action: () => {
        S.potions--;
        heal(8);
        enemyTurn();
      }});
    }
    choices.push({ label: '🏃 Flee', action: () => {
      if (Math.random() < 0.6) {
        addEntry('You flee from the ' + name + '!', 'player-action');
        showRoom();
      } else {
        addEntry('Failed to flee!', 'player-action');
        enemyTurn();
      }
    }});
    showChoices(choices);
  }

  function enemyTurn() {
    if (checkDeath()) return;
    const dmg = rand(Math.max(1, atk - 1), atk + 1);
    const dead = takeDamage(dmg);
    addEntry(name + ' attacks you for <strong style="color:#f44336">' + dmg + ' damage</strong>! (HP: ' + S.hp + '/' + S.maxHp + ')', 'combat');
    if (!dead) fightMenu();
  }

  fightMenu();
}

// --- ROOMS ---

function startGame() {
  S.finished = false; S.startAt = Date.now(); S.elapsed = 0; S.moves = 0; S.milestones = [];
  startClock();
  refreshBadge();
  $('title-screen').style.opacity = '0';
  setTimeout(() => $('title-screen').classList.add('hidden'), 500);
  showRoom();
}

function showRoom() {
  S.room++;
  if (S.startAt != null) S.milestones.push({ room: S.room, t: Date.now() - S.startAt });
  updateStats();

  const rooms = [
    room1, room2, room3, room4, room5,
    room6, room7, room8, room9, roomBoss
  ];

  if (S.room <= rooms.length) {
    rooms[S.room - 1]();
  } else {
    victory();
  }
}

setTimeout(() => {
  refreshBadge();
  mpConnect();
  loadBoard();
  try {
    const all = localSaves();
    const hasAny = Object.keys(all).some(k => all[k] && all[k].state && all[k].state.room > 0) || getToken();
    $('continue-btn').style.opacity = hasAny ? '1' : '0.35';
    $('continue-btn').disabled = !hasAny;
  } catch (e) {}
}, 100);

function room1() {
  addEntry('<div class="room-title">Room 1: The Entrance</div>You descend the cold stone steps into the dungeon. The air is damp and smells of moss. A faint torchlight flickers ahead, and you hear water dripping somewhere in the dark. Two passages lie before you.', 'narrator');
  showChoices([
    { label: '→ Take the left passage', action: () => {
      addEntry('You squeeze through the narrow left passage and find a rusted chest half-buried in rubble.', 'narrator');
      S.gold += 12;
      updateStats();
      addEntry('You open the chest and find <strong style="color:var(--gold)">12 gold coins</strong>!', 'loot');
      showChoices([{ label: 'Continue deeper', action: () => showRoom() }]);
    }},
    { label: '→ Take the right passage', action: () => {
      addEntry('The right passage opens into a small chamber.', 'narrator');
      combatEnemy('Giant Rat', 8, 2, 10, () => {
        addEntry('Behind the rat\'s nest, you find a <strong>health potion</strong>!', 'loot');
        S.potions++;
        updateStats();
        showChoices([{ label: 'Continue deeper', action: () => showRoom() }]);
      });
    }},
  ]);
}

function room2() {
  addEntry('<div class="room-title">Room 2: The Flooded Corridor</div>Water covers the floor ankle-deep. Bioluminescent fungi line the walls, casting an eerie blue glow. You can see skeletal remains ahead.', 'narrator');
  showChoices([
    { label: '→ Search the remains', action: () => {
      S.gold += 8;
      S.atk++;
      updateStats();
      addEntry('You find <strong style="color:var(--gold)">8 gold</strong> and a <strong>sharper blade</strong> among the bones! (ATK: ' + S.atk + ')', 'loot');
      showChoices([{ label: 'Move forward', action: () => showRoom() }]);
    }},
    { label: '→ Press on quickly', action: () => {
      addEntry('A skeleton hand grabs your ankle as you pass! You take <strong style="color:#f44336">3 damage</strong>.', 'combat');
      takeDamage(3);
      if (!checkDeath()) showChoices([{ label: 'Move forward', action: () => showRoom() }]);
    }},
  ]);
}

function room3() {
  addEntry('<div class="room-title">Room 3: The Goblin\'s Den</div>You stumble into a makeshift camp. Empty stew pots and scattered bones litter the floor. A goblin is hunched over, gnawing on something. It hasn\'t noticed you yet.', 'narrator');
  showChoices([
    { label: '⚔ Ambush the goblin', cls: 'attack', action: () => {
      addEntry('You strike first! The goblin takes <strong>' + (S.atk + 2) + ' damage</strong> before it can react.', 'combat');
      combatEnemy('Goblin', 14 - S.atk - 2, 4, 20, () => {
        addEntry('The goblin\'s stash contains <strong style="color:var(--gold)">20 gold</strong> and a <strong>health potion</strong>!', 'loot');
        S.potions++;
        updateStats();
        showChoices([{ label: 'Continue', action: () => showRoom() }]);
      });
    }},
    { label: '→ Sneak past', action: () => {
      if (Math.random() < 0.5) {
        addEntry('You tiptoe past the goblin without being detected. Smart and stealthy.', 'player-action');
        showRoom();
      } else {
        addEntry('Your foot splashes in the water. The goblin spots you and lunges!', 'combat');
        combatEnemy('Goblin', 14, 4, 15, () => showRoom());
      }
    }},
  ]);
}

function room4() {
  addEntry('<div class="room-title">Room 4: The Healing Shrine</div>A small alcove with a stone fountain glowing with soft green light. An inscription reads: "Drink, and be restored." The water looks inviting.', 'narrator');
  showChoices([
    { label: '→ Drink from the fountain', cls: 'heal', action: () => {
      S.hp = S.maxHp;
      updateStats();
      addEntry('Warmth flows through your body. <strong>Full HP restored!</strong> (HP: ' + S.hp + '/' + S.maxHp + ')', 'loot');
      showChoices([{ label: 'Continue', action: () => showRoom() }]);
    }},
    { label: '→ Take a health potion instead', cls: 'heal', action: () => {
      S.potions++;
      updateStats();
      addEntry('You carefully bottle some of the magical water. <strong>Got a health potion!</strong> (' + S.potions + ' potions)', 'loot');
      showChoices([{ label: 'Continue', action: () => showRoom() }]);
    }},
    { label: '→ Leave it, be cautious', action: () => {
      addEntry('You decide not to risk it. The water could be poisoned. You move on.', 'player-action');
      showRoom();
    }},
  ]);
}

function room5() {
  addEntry('<div class="room-title">Room 5: The Armory</div>Rusted weapon racks line the walls. Most weapons have crumbled, but something glints in the corner — a sword with runes etched into its blade.', 'narrator');
  showChoices([
    { label: '→ Take the rune sword', action: () => {
      S.atk += 3;
      updateStats();
      addEntry('You grip the rune sword. Power surges through you. <strong>ATK +3!</strong> (ATK: ' + S.atk + ')', 'loot');
      showChoices([{ label: 'Continue', action: () => showRoom() }]);
    }},
    { label: '→ Search the racks instead', action: () => {
      S.gold += 15;
      S.atk++;
      updateStats();
      addEntry('You search the racks and find <strong style="color:var(--gold)">15 gold</strong> and a <strong>sturdier shield</strong> that doubles as a weapon. (ATK: ' + S.atk + ')', 'loot');
      showChoices([{ label: 'Continue', action: () => showRoom() }]);
    }},
  ]);
}

function room6() {
  addEntry('<div class="room-title">Room 6: The Spiders\' Web</div>Thick webs fill the corridor. Something large moves above you. Eggsacs hang from the ceiling, pulsing ominously.', 'narrator');
  combatEnemy('Giant Spider', 16, 5, 25, () => {
    S.gold += 10;
    addEntry('Among the webbed remains, you find <strong style="color:var(--gold)">10 more gold</strong> and a <strong>health potion</strong>.', 'loot');
    S.potions++;
    updateStats();
    showChoices([{ label: 'Continue deeper', action: () => showRoom() }]);
  });
}

function room7() {
  addEntry('<div class="room-title">Room 7: The Treasure Room</div>A room filled with glittering coins and jewels. Traps dot the floor — pressure plates, trip wires, poison darts.', 'narrator');
  showChoices([
    { label: '→ Carefully navigate the traps', action: () => {
      const success = Math.random() < 0.65;
      if (success) {
        S.gold += 50;
        updateStats();
        addEntry('You deftly avoid every trap and fill your pockets with <strong style="color:var(--gold)">50 gold</strong>!', 'loot');
      } else {
        const dmg = rand(5, 10);
        S.gold += 25;
        takeDamage(dmg);
        addEntry('A poison dart hits your arm! You take <strong style="color:#f44336">' + dmg + ' damage</strong> but still grab <strong style="color:var(--gold)">25 gold</strong>.', 'combat');
      }
      updateStats();
      if (!checkDeath()) showChoices([{ label: 'Continue', action: () => showRoom() }]);
    }},
    { label: '→ Grab what you can quickly', action: () => {
      const dmg = rand(3, 7);
      takeDamage(dmg);
      S.gold += 15;
      updateStats();
      addEntry('You sprint through, grabbing coins. A trap hits you for <strong style="color:#f44336">' + dmg + ' damage</strong>, but you escape with <strong style="color:var(--gold)">15 gold</strong>.', 'combat');
      if (!checkDeath()) showChoices([{ label: 'Continue', action: () => showRoom() }]);
    }},
  ]);
}

function room8() {
  addEntry('<div class="room-title">Room 8: The Crypt</div>Ancient coffins line the walls. One is open. Inside, a skeleton king wears a crown of tarnished gold. As you approach, its eye sockets flare with blue flame.', 'narrator');
  combatEnemy('Skeleton King', 22, 6, 35, () => {
    addEntry('The skeleton king crumbles. Its crown rolls to your feet — <strong style="color:var(--gold)">35 gold</strong> worth!', 'loot');
    updateStats();
    showChoices([{ label: 'Continue to the depths', action: () => showRoom() }]);
  });
}

function room9() {
  addEntry('<div class="room-title">Room 9: The Dark Altar</div>A blood-stained altar dominates this room. Candles burn with black fire. A dark voice whispers from the shadows, offering a bargain.', 'narrator');
  showChoices([
    { label: '→ Accept the bargain (sacrifice HP for power)', cls: 'special', action: () => {
      const cost = Math.min(S.hp - 1, 8);
      S.hp -= cost;
      S.atk += 4;
      S.maxHp += 5;
      S.hp = Math.min(S.hp + 5, S.maxHp);
      updateStats();
      addEntry('Dark energy courses through you. You sacrifice <strong style="color:#f44336">' + cost + ' HP</strong> but gain <strong>ATK +4</strong> and <strong>Max HP +5</strong>! (ATK: ' + S.atk + ', HP: ' + S.hp + '/' + S.maxHp + ')', 'loot');
      showChoices([{ label: 'Descend to the final chamber', action: () => showRoom() }]);
    }},
    { label: '→ Reject the bargain', action: () => {
      addEntry('The shadows hiss in anger, but you stand firm. Your will is unbroken.', 'player-action');
      S.gold += 10;
      updateStats();
      addEntry('The darkness leaves behind a pile of coins as it retreats. <strong style="color:var(--gold)">+10 gold</strong>.', 'loot');
      showChoices([{ label: 'Descend to the final chamber', action: () => showRoom() }]);
    }},
  ]);
}

function roomBoss() {
  addEntry('<div class="room-title">THE FINAL CHAMBER: The Dragon</div>A massive dragon coils atop a mountain of gold. Its scales shimmer like obsidian. Red eyes fixate on you as smoke curls from its nostrils.', 'narrator');
  combatEnemy('Shadow Dragon', 35, 7, 100, () => {
    addEntry('The Shadow Dragon collapses with a thunderous crash! The dungeon trembles!', 'loot');
    S.gold += 50;
    updateStats();
    showChoices([{ label: '🏆 Escape the dungeon', action: () => victory() }]);
  });
}
</script>

</body>
</html>
