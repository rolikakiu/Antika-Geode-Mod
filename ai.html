<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #e4e4e4;
    --text-muted: #888;
    --accent: #7c5cff;
    --accent-dim: #5a3ed4;
    --user-bg: #7c5cff;
    --user-text: #fff;
    --ai-bg: #1e1e1e;
    --ai-text: #e4e4e4;
    --radius: 16px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    flex-shrink: 0;
  }

  .header-info h1 { font-size: 16px; font-weight: 600; }
  .header-info p { font-size: 12px; color: var(--text-muted); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg.user .avatar { background: var(--user-bg); color: #fff; }
  .msg.ai .avatar { background: var(--surface2); color: var(--accent); border: 1px solid var(--border); }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }

  .msg.ai .bubble {
    background: var(--ai-bg);
    color: var(--ai-text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .typing-indicator .bubble::after {
    content: '';
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--text-muted);
    border-radius: 50%;
    margin-left: 4px;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .welcome {
    text-align: center;
    margin: auto;
    color: var(--text-muted);
  }
  .welcome h2 { font-size: 22px; color: var(--text); margin-bottom: 8px; font-weight: 600; }
  .welcome p { font-size: 14px; }

  #input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  #input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    max-width: 720px;
    margin: 0 auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 12px;
    transition: border-color 0.2s;
  }

  #input-wrap:focus-within { border-color: var(--accent); }

  #input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 150px;
    line-height: 1.5;
    padding: 4px 0;
  }

  #input::placeholder { color: var(--text-muted); }

  #send {
    width: 36px;
    height: 36px;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
  }

  #send:hover { background: var(--accent-dim); }
  #send:active { transform: scale(0.94); }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }

  #send svg { width: 18px; height: 18px; }

  .suggestions {
    display: flex;
    gap: 8px;
    max-width: 720px;
    margin: 8px auto 0;
    flex-wrap: wrap;
  }

  .suggestion {
    padding: 6px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 12.5px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .suggestion:hover {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(124, 92, 255, 0.08);
  }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    #chat { padding: 16px; }
    #input-area { padding: 12px 16px; }
    .msg { max-width: 100%; }
  }

  #settings-btn {
    margin-left: auto;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  #settings-btn:hover { color: var(--text); border-color: var(--accent); }
  #settings-btn svg { width: 18px; height: 18px; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    animation: fadeIn 0.2s ease;
  }

  .modal h3 { font-size: 18px; margin-bottom: 16px; }

  .modal label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
    margin-top: 14px;
  }

  .modal input,
  .modal select {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .modal input:focus,
  .modal select:focus { border-color: var(--accent); }

  .modal .hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }

  .modal-actions button {
    padding: 8px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: all 0.2s;
  }

  .modal-cancel { background: var(--surface2); color: var(--text); }
  .modal-cancel:hover { background: var(--border); }

  .modal-save { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal-save:hover { background: var(--accent-dim); }
</style>
</head>
<body>

<header>
  <div class="logo">AI</div>
  <div class="header-info">
    <h1>AI Assistant</h1>
    <p id="status">Ready</p>
  </div>
  <button id="settings-btn" onclick="openSettings()" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
</header>

<div id="chat">
  <div class="welcome">
    <h2>How can I help you today?</h2>
    <p>Ask me anything — coding, writing, ideas, math, and more.</p>
  </div>
</div>

<div id="input-area">
  <div id="input-wrap">
    <textarea id="input" rows="1" placeholder="Message AI..." autofocus></textarea>
    <button id="send" disabled aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <div class="suggestions" id="suggestions">
    <button class="suggestion" data-prompt="Explain quantum computing simply">Explain quantum computing</button>
    <button class="suggestion" data-prompt="Write a Python function to sort a list">Write a sorting function</button>
    <button class="suggestion" data-prompt="Give me 5 creative project ideas">Project ideas</button>
    <button class="suggestion" data-prompt="What are best practices for REST API design?">REST API tips</button>
  </div>
</div>

<div id="settings-modal" class="modal-overlay" onclick="closeSettingsOnOverlay(event)">
  <div class="modal">
    <h3>Settings</h3>
    <label>Google Gemini API Key</label>
    <input id="api-key-input" type="password" placeholder="AIza..." autocomplete="off" />
    <p class="hint">Key is stored in your browser only — never sent anywhere else.</p>
    <label>Model</label>
    <select id="model-select">
      <option value="gemini-2.5-flash">gemini-2.5-flash</option>
      <option value="gemini-2.0-flash" selected>gemini-2.0-flash</option>
      <option value="gemini-2.5-pro">gemini-2.5-pro</option>
      <option value="gemini-1.5-flash">gemini-1.5-flash</option>
      <option value="gemini-1.5-pro">gemini-1.5-pro</option>
    </select>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeSettings()">Cancel</button>
      <button class="modal-save" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const status = document.getElementById('status');
const suggestions = document.getElementById('suggestions');
let isGenerating = false;

const responses = {
  "hello": "Hello! I'm your AI assistant. How can I help you today?",
  "hi": "Hi there! What can I do for you?",
  "help": "Sure! I can help with:\n• Writing and editing text\n• Coding and debugging\n• Explaining concepts\n• Math and logic problems\n• Creative brainstorming\n• And much more!\n\nJust type your question or request.",
  "who are you": "I'm an AI assistant built to help you with a wide range of tasks — from answering questions and writing code to brainstorming ideas and explaining complex topics. I'm here to make your workflow smoother!",
  "what can you do": "Here are some things I can help with:\n\n📝 Writing — essays, emails, stories, summaries\n💻 Code — write, debug, explain code in any language\n🧠 Knowledge — science, history, math, philosophy\n🎨 Creative — brainstorm names, ideas, content\n📊 Analysis — data, logic, reasoning\n🔧 Tools — help with Git, APIs, databases, and more",
  "thank you": "You're welcome! Let me know if there's anything else I can help with.",
  "thanks": "Happy to help! Anything else you need?",
};

function getAutoResponse(msg) {
  const lower = msg.toLowerCase().trim();
  if (responses[lower]) return responses[lower];
  if (lower.includes('hello') || lower.includes('hi ')) return responses['hello'];
  if (lower.includes('thank')) return responses['thank you'];

  if (lower.includes('python') || lower.includes('javascript') || lower.includes('code') || lower.includes('function') || lower.includes('write a')) {
    return generateCodeResponse(msg);
  }
  if (lower.includes('explain') || lower.includes('what is') || lower.includes('what are') || lower.includes('how does')) {
    return generateExplainResponse(msg);
  }
  if (lower.includes('write') || lower.includes('create') || lower.includes('draft')) {
    return generateWriteResponse(msg);
  }
  if (lower.match(/\d+\s*[\+\-\*\/\^]\s*\d+/) || lower.includes('calculate') || lower.includes('math')) {
    return generateMathResponse(msg);
  }
  if (lower.includes('idea') || lower.includes('suggest') || lower.includes('brainstorm')) {
    return generateIdeasResponse(msg);
  }

  return `That's an interesting topic! Let me think about that...

**"${msg}**

Here are my thoughts:

1. This is a great question that touches on several important concepts.
2. The answer depends on the specific context and requirements you're working with.
3. I'd recommend breaking this down into smaller, more focused sub-questions.

Would you like me to go deeper into any particular aspect of this? I can provide more detailed analysis, examples, or practical recommendations based on your specific needs.`;
}

function generateCodeResponse(msg) {
  const lower = msg.toLowerCase();
  if (lower.includes('python') && (lower.includes('sort') || lower.includes('list'))) {
    return `Here's a clean Python function to sort a list:

\`\`\`python
def sort_list(items, reverse=False, key=None):
    """Sort a list with optional reverse and key function."""
    return sorted(items, reverse=reverse, key=key)

# Examples
numbers = [4, 2, 7, 1, 9, 3]
print(sort_list(numbers))           # [1, 2, 3, 4, 7, 9]
print(sort_list(numbers, reverse=True))  # [9, 7, 4, 3, 2, 1]

words = ["banana", "apple", "cherry"]
print(sort_list(words))             # ['apple', 'banana', 'cherry']
print(sort_list(words, key=len))    # ['apple', 'banana', 'cherry']
\`\`\`

**Key points:**
- Uses Python's built-in \`sorted()\` which is Timsort (O(n log n))
- The \`key\` parameter lets you customize sort order
- Returns a new list (doesn't modify the original)

Need it to work with a custom object or a different language? Let me know!`;
  }
  if (lower.includes('javascript') || lower.includes('js')) {
    return `Here's a JavaScript example — a reusable debounce function:

\`\`\`javascript
function debounce(fn, delay = 300) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

// Usage
const handleSearch = debounce((query) => {
  console.log('Searching for:', query);
  // API call here
}, 500);

input.addEventListener('input', (e) => handleSearch(e.target.value));
\`\`\`

This is commonly used for search inputs, resize handlers, and any frequently-fired event. Want me to explain how it works or create something else?`;
  }
  return `Here's a code solution for your request:

\`\`\`python
# Solution based on: ${msg}
def solution():
    """
    A flexible solution that handles the core requirements.
    Can be extended based on specific edge cases.
    """
    result = []
    # Core logic here
    return result

# Test it
if __name__ == "__main__":
    output = solution()
    print(f"Result: {output}")
\`\`\`

This is a starting point. Would you like me to:
- Add error handling and validation?
- Optimize for performance?
- Add unit tests?
- Adapt it to a specific language or framework?`;
}

function generateExplainResponse(msg) {
  return `Great question! Let me break this down clearly.

**Here's the core concept:**

This topic can be understood through a few key principles:

1. **Foundation** — At its core, it's about understanding how the fundamental pieces fit together and interact with each other.

2. **Mechanism** — The process works by taking inputs, applying transformations or rules, and producing meaningful outputs.

3. **Applications** — In practice, this is used across many domains to solve real-world problems efficiently.

**A simple analogy:**
Think of it like a recipe — you have ingredients (inputs), instructions (the process), and a finished dish (the output). Each step matters, and the order determines the result.

**Why it matters:**
Understanding this gives you a solid foundation for more advanced topics and helps you make better decisions when applying these concepts.

Want me to dive deeper into any specific aspect? I can provide examples, comparisons, or more technical details.`;
}

function generateWriteResponse(msg) {
  return `Here's a draft for your request:

---

**Title: Creative Draft**

In a world constantly evolving with new ideas and perspectives, the ability to adapt and innovate remains paramount. This piece explores the intersection of creativity and practicality — how we can harness imagination while staying grounded in reality.

The key lies not in choosing one over the other, but in finding the balance where both thrive. When creative thinking meets structured execution, the results speak for themselves.

---

This is a starting framework. I can adjust the:
- **Tone** — formal, casual, persuasive, academic
- **Length** — expand or condense
- **Focus** — shift emphasis to specific points
- **Style** — narrative, analytical, instructional

What direction would you like to take it?`;
}

function generateMathResponse(msg) {
  return `Let me work through the math:

**Analysis:**

When we break this down step by step:

1. **Identify** the key variables and their relationships
2. **Set up** the equation or expression
3. **Simplify** using order of operations (PEMDAS/BODMAS)
4. **Solve** for the final result

The approach depends on what specifically you're calculating. Common techniques include:

- **Algebraic manipulation** — isolating variables
- **Arithmetic evaluation** — following operator precedence
- **Pattern recognition** — identifying sequences or formulas

If you share the specific problem, I'll walk you through the exact solution with each step shown clearly. I can also verify the answer and suggest alternative approaches!`;
}

function generateIdeasResponse(msg) {
  return `Here are some ideas to spark your creativity:

**1. AI-Powered Study Buddy**
An app that creates personalized quizzes from your notes, identifies weak areas, and adapts difficulty in real-time.

**2. Smart Garden Monitor**
A Raspberry Pi project that tracks soil moisture, light, and temperature — then texts you when your plants need water.

**3. Budget Tracker Bot**

**4. Local Explorer App**

**5. Focus Mode Extension**
A browser extension that replaces your new tab page with a minimalist dashboard: pomodoro timer, daily goals, and a calming background.

**6. Recipe from leftovers**
Snap a photo of what's in your fridge, and it suggests recipes using only those ingredients.

Want me to expand on any of these with a full spec, tech stack, or implementation plan?`;
}

function addMessage(text, sender) {
  const welcome = chat.querySelector('.welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `msg ${sender}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = sender === 'user' ? 'You' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  div.appendChild(avatar);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'msg ai typing-indicator';
  div.id = 'typing';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = 'Thinking';

  div.appendChild(avatar);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function formatMarkdown(text) {
  return text
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

async function typeResponse(text, bubble) {
  bubble.innerHTML = '';
  const formatted = formatMarkdown(text);
  bubble.innerHTML = formatted;
  bubble.style.animation = 'none';
  bubble.offsetHeight;
  bubble.style.animation = 'fadeIn 0.3s ease';
  chat.scrollTop = chat.scrollHeight;
}

const GEMINI_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
const FALLBACK_DELAY = 400 + Math.random() * 700;

function getApiKey() {
  return (localStorage.getItem('gemini_api_key') || '').trim();
}

function getModel() {
  return localStorage.getItem('gemini_model') || 'gemini-2.0-flash';
}

function openSettings() {
  document.getElementById('api-key-input').value = getApiKey();
  document.getElementById('model-select').value = getModel();
  document.getElementById('settings-modal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}

function closeSettingsOnOverlay(e) {
  if (e.target === e.currentTarget) closeSettings();
}

function saveSettings() {
  localStorage.setItem('gemini_api_key', document.getElementById('api-key-input').value.trim());
  localStorage.setItem('gemini_model', document.getElementById('model-select').value);
  closeSettings();
}

async function callGemini(prompt, signal) {
  const res = await fetch(GEMINI_ENDPOINT + getModel() + ':generateContent?key=' + encodeURIComponent(getApiKey()), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    signal: signal,
    body: JSON.stringify({
      contents: [{ role: 'user', parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
    })
  });

  if (!res.ok) {
    const body = await res.text();
    if (res.status === 400 || res.status === 401 || res.status === 403) {
      throw new Error('Gemini rejected your API key (' + res.status + '). Check it in Settings. ' + (body || ''));
    }
    throw new Error('Gemini API error ' + res.status + ': ' + body);
  }

  const data = await res.json();
  const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
  if (!text) throw new Error('Gemini returned an empty response.');
  return text;
}

async function handleSend() {
  const text = input.value.trim();
  if (!text || isGenerating) return;

  isGenerating = true;
  sendBtn.disabled = true;
  suggestions.style.display = 'none';
  input.value = '';
  input.style.height = 'auto';
  status.textContent = 'Thinking...';

  addMessage(text, 'user');
  addTypingIndicator();

  let response;
  let usedApi = false;

  if (getApiKey()) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 45000);
      response = await callGemini(text, controller.signal);
      clearTimeout(timer);
      usedApi = true;
    } catch (err) {
      removeTypingIndicator();
      addMessage('Could not reach Gemini: ' + err.message + '\n\nShowing a local fallback response:', 'ai');
      addTypingIndicator();
      await new Promise(r => setTimeout(r, FALLBACK_DELAY));
      response = getAutoResponse(text);
    }
  } else {
    await new Promise(r => setTimeout(r, FALLBACK_DELAY));
    response = getAutoResponse(text);
  }

  removeTypingIndicator();
  const bubble = addMessage('', 'ai');
  bubble.classList.add('typing-indicator');

  await typeResponse(response, bubble);
  bubble.classList.remove('typing-indicator');

  isGenerating = false;
  sendBtn.disabled = false;
  status.textContent = usedApi ? 'Ready' : 'Ready (local mode)';
  input.focus();
}

sendBtn.addEventListener('click', handleSend);

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
  sendBtn.disabled = !input.value.trim();
});

document.querySelectorAll('.suggestion').forEach(btn => {
  btn.addEventListener('click', () => {
    input.value = btn.dataset.prompt;
    sendBtn.disabled = false;
    handleSend();
  });
});
</script>
</body>
</html>
